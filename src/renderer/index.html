<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: local-resource: blob:; connect-src 'self' local-resource: https://*.baidu.com https://*.deepseek.com https://*.openai.com https://*.moonshot.cn https://*.aliyuncs.com">
  <title>文献管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .renderer-startup {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #d9d4cf;
      background: #0e0d0c;
      font-family: Inter, "Noto Serif SC", sans-serif;
    }

    .renderer-startup__content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .renderer-startup__mark {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(196, 149, 106, 0.25);
      border-top-color: #c4956a;
      border-radius: 50%;
      animation: renderer-startup-spin 0.9s linear infinite;
    }

    @keyframes renderer-startup-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="renderer-startup" role="status">
      <div class="renderer-startup__content">
        <span class="renderer-startup__mark" aria-hidden="true"></span>
        <span>正在启动文献管理...</span>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
